name: "CodeQL Advanced"

on:
  push:
    branches: [ "main", "experimental" ]
  pull_request:
    branches: [ "main", "experimental" ]
  schedule:
    - cron: '17 19 * * 6'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual
        - language: python
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Setup Python and build dependencies for C++ compilation tracing
    - name: Set up Python
      if: matrix.language == 'c-cpp'
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: pip

    - name: Install build dependencies
      if: matrix.language == 'c-cpp'
      run: |
        sudo apt-get install -y --no-install-recommends pybind11-dev
        pip install pybind11 numpy setuptools wheel

    # Initializes the CodeQL tools for scanning.
    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-and-quality

    # Run manual C++ build to let CodeQL trace compilation
    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      run: |
        python setup.py build_ext --inplace

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
