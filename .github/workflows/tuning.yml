name: RD tuning sweep

# Parallel parameter sweep for known-flaws A3/A4. Dispatch builds the codec
# with 9 different ladder/divisor combinations simultaneously. Each job
# produces an RD table in the step summary. Compare all tables to pick
# winning constants, then bake them into v2_core.cpp as the new defaults.
# Stock values: scale=1.5, divisor=16.0. Scale 2.5 was tried and reverted
# (issue #44: visible chroma artifacts at medium quality). Divisor 16 adds
# intermediate lossy ladder steps with no quality regression.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sweep:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: stock
            scale: "1.5"
            divisor: "16.0"
          - label: steep-ladder
            scale: "2.5"
            divisor: "16.0"
          - label: flat-ladder
            scale: "1.0"
            divisor: "8.0"
          - label: wide-range
            scale: "3.0"
            divisor: "8.0"
          - label: size-biased
            scale: "2.0"
            divisor: "32.0"
          - label: deep-divisor
            scale: "1.5"
            divisor: "24.0"
          - label: gentle-divisor
            scale: "1.5"
            divisor: "4.0"
          - label: steepest
            scale: "3.5"
            divisor: "16.0"
    steps:
      - uses: actions/checkout@v6
      - name: Build and sweep
        shell: bash
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Wno-misleading-indentation \
            -DWIMF_SIMD_ENABLE_AVX2 \
            "-DWIMF_LADDER_SCALE=${{ matrix.scale }}" \
            "-DWIMF_SCORING_DIVISOR=${{ matrix.divisor }}" \
            -Isrc -Ithird_party/zstd \
            tools/wimf_rd_sweep.cpp src/v2_core.cpp \
            src/v2_simd.cpp src/v2_simd_avx2.cpp src/v2_simd_neon.cpp src/v2_simd_crc.cpp \
            third_party/zstd/zstd.c -pthread -o rd-sweep
          ./rd-sweep > rd-table.md
      - name: Publish to summary
        shell: bash
        run: |
          {
            echo "## ${{ matrix.label }} (scale=${{ matrix.scale }}, divisor=${{ matrix.divisor }})"
            echo ""
            cat rd-table.md
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: rd-${{ matrix.label }}
          path: rd-table.md
          retention-days: 30
