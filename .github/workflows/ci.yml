name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install ruff mypy numpy pillow zstandard
      - run: python -m ruff check wimf tests benchmarks examples setup.py --output-format=github
      - run: python -m ruff format wimf tests benchmarks examples setup.py --check
      - run: python -m mypy wimf --ignore-missing-imports --no-strict-optional --python-version 3.12

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pybind11 numpy pillow zstandard setuptools wheel
      - run: python setup.py build_ext --inplace
      - name: Verify native extensions
        run: python -c "import wimf.wimf_cpp, wimf.wimf_v2_cpp; assert wimf.runtime_info()['native']"
      - run: python -m pytest wimf/test_core.py wimf/test_v2.py wimf/test_studio.py -v --junitxml=test-results.xml
      - name: Upload test results
        if: ${{ always() && hashFiles('test-results.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          retention-days: 14

  awif-test:
    name: AWIF / ${{ matrix.os }} / Python 3.12
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest pybind11 numpy pillow zstandard setuptools wheel
      - run: python setup.py build_ext --inplace
      - name: Verify native acceleration
        run: python -c "import wimf.wimf_cpp; assert wimf.runtime_info()['native']"
      - name: Run AWIF timing, geometry, quality, and compatibility matrix
        run: python -m pytest wimf/test_awif.py -v --junitxml=awif-results.xml
      - name: Upload AWIF test results
        if: ${{ always() && hashFiles('awif-results.xml') != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: awif-results-${{ matrix.os }}
          path: awif-results.xml
          retention-days: 14

  native-core:
    name: Standalone C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build and test with MSVC
        if: runner.os == 'Windows'
        run: |
          cl /nologo /O2 /c /Ithird_party/zstd third_party/zstd/zstd.c /Fo:zstd.obj
          cl /nologo /std:c++17 /EHsc /O2 /Isrc /Ithird_party/zstd tests/cpp/test_v2_core.cpp src/v2_core.cpp zstd.obj /Fe:v2_core_tests.exe
          .\v2_core_tests.exe
      - name: Build and test with the system C++ compiler
        if: runner.os != 'Windows'
        run: |
          cc -O2 -Ithird_party/zstd -c third_party/zstd/zstd.c -o zstd.o
          c++ -std=c++17 -O2 -Wall -Wextra -Wno-misleading-indentation -Isrc -Ithird_party/zstd tests/cpp/test_v2_core.cpp src/v2_core.cpp zstd.o -pthread -o v2_core_tests
          ./v2_core_tests
      - name: Compile synchronous core with Emscripten when available
        if: runner.os == 'Linux'
        run: |
          if command -v em++ >/dev/null 2>&1; then
            em++ -std=c++17 -O2 -Ithird_party/zstd -c src/v2_core.cpp -o v2_core_wasm.o
            emcc -O2 -Ithird_party/zstd -c third_party/zstd/zstd.c -o zstd_wasm.o
          else
            echo "Emscripten is not installed on this runner; portable compile check skipped."
          fi

  visual-report:
    name: Visual codec report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install pytest pybind11 numpy pillow zstandard setuptools wheel
      - run: python setup.py build_ext --inplace
      - run: python tests/generate_ci_report.py --input .github/assets/dark.png --output codec-report
      - name: Render WIMF Studio states
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y xvfb
          fi
          xvfb-run -a python tests/generate_studio_screenshots.py codec-report/studio
      - name: Upload visual evidence
        id: visual-artifact
        uses: actions/upload-artifact@v7
        with:
          name: codec-visual-report
          path: codec-report/
          retention-days: 30
      - name: Publish job summary
        run: |
          cat codec-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download decoded images, difference heatmap, metrics, and WIMF files](${{ steps.visual-artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package metadata and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*

  native-sanitizers:
    name: Native parser sanitizers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build parser mutation test with ASan and UBSan
        run: |
          cc -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -Ithird_party/zstd -c third_party/zstd/zstd.c -o zstd.o
          c++ -std=c++17 -O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined \
            -Wall -Wextra -Wno-misleading-indentation -Isrc -Ithird_party/zstd \
            tests/cpp/fuzz_v2_parser.cpp src/v2_core.cpp zstd.o -pthread -o fuzz_v2_parser
      - run: ./fuzz_v2_parser

  codec-benchmark:
    name: Python vs C++ codecs / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pybind11 numpy pillow zstandard setuptools wheel
      - run: python setup.py build_ext --inplace
      - name: Benchmark WIM2 stills and AWIF animation
        shell: bash
        run: |
          python benchmarks/bench_codecs.py --still-size 512 --animation-width 320 --animation-height 180 --animation-frames 30 > codec-benchmark.json
          cat codec-benchmark.json
          echo "## Python vs C++ codec benchmark — ${{ runner.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat codec-benchmark.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: codec-benchmark-${{ matrix.os }}
          path: codec-benchmark.json
          retention-days: 30
