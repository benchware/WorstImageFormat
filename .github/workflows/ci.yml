name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Code Quality (Python) ──────────────────────────────────────────────
  lint:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install linting tools
        run: pip install ruff mypy numpy pillow

      - name: Ruff – lint
        run: ruff check wimf/ --output-format=github

      - name: Ruff – format check
        run: ruff format wimf/ --check

      - name: Mypy – type check
        run: mypy wimf/ --ignore-missing-imports --no-strict-optional

  # ─── 2. Tests + Coverage (multi-Python) ───────────────────────────────────
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Cache the compiled .so so repeat runs are fast
      - name: Cache C++ extension build
        uses: actions/cache@v4
        with:
          path: wimf/wimf_cpp*.so
          key: cppext-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('src/main.cpp', 'setup.py') }}

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends pybind11-dev
          pip install pybind11 numpy pillow pytest pytest-cov setuptools wheel

      - name: Build C++ extension
        run: python setup.py build_ext --inplace

      - name: Run tests with coverage
        run: |
          pytest wimf/test_core.py -v \
            --cov=wimf \
            --cov-report=term-missing \
            --cov-report=xml:coverage-${{ matrix.python-version }}.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage-${{ matrix.python-version }}.xml

      # Post a coverage summary comment on PRs (only once, on 3.12)
      - name: Coverage summary
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: orgoro/coverage@v3.2
        with:
          coverageFile: coverage-${{ matrix.python-version }}.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          thresholdAll: 0.60
          thresholdNew: 0.80

  # ─── 3. CodeQL – Python ────────────────────────────────────────────────────
  codeql-python:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          # Use the security-and-quality query suite (covers more than the default)
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  # ─── 4. CodeQL – C++ ──────────────────────────────────────────────────────
  codeql-cpp:
    name: CodeQL (C++)
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends pybind11-dev
          pip install pybind11 numpy setuptools wheel

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-and-quality

      # CodeQL needs to witness the actual build to trace the C++ compilation
      - name: Build C++ extension (for CodeQL tracing)
        run: python setup.py build_ext --inplace

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
