name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install ruff mypy numpy pillow zstandard
      - run: python -m ruff check wimf tests benchmarks setup.py --output-format=github
      - run: python -m ruff format wimf tests benchmarks setup.py --check
      - run: python -m mypy wimf --ignore-missing-imports --no-strict-optional --python-version 3.12

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pytest pybind11 numpy pillow zstandard setuptools wheel
      - run: python setup.py build_ext --inplace
      - name: Verify native extensions
        run: python -c "import wimf.wimf_cpp, wimf.wimf_v2_cpp; assert wimf.runtime_info()['native']"
      - run: python -m pytest wimf/test_core.py wimf/test_v2.py -v --junitxml=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python }}
          path: test-results.xml
          retention-days: 14

  native-core:
    name: Standalone C++ / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build and test with MSVC
        if: runner.os == 'Windows'
        run: |
          cl /nologo /std:c++17 /EHsc /O2 /Isrc tests/cpp/test_v2_core.cpp src/v2_core.cpp /Fe:v2_core_tests.exe
          .\v2_core_tests.exe
      - name: Build and test with the system C++ compiler
        if: runner.os != 'Windows'
        run: |
          c++ -std=c++17 -O2 -Wall -Wextra -Wno-misleading-indentation -Isrc tests/cpp/test_v2_core.cpp src/v2_core.cpp -o v2_core_tests
          ./v2_core_tests

  visual-report:
    name: Visual codec report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install pytest pybind11 numpy pillow zstandard setuptools wheel
      - run: python setup.py build_ext --inplace
      - run: python tests/generate_ci_report.py --input .github/assets/dark.png --output codec-report
      - name: Upload visual evidence
        id: visual-artifact
        uses: actions/upload-artifact@v4
        with:
          name: codec-visual-report
          path: codec-report/
          retention-days: 30
      - name: Publish job summary
        run: |
          cat codec-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download decoded images, difference heatmap, metrics, and WIMF files](${{ steps.visual-artifact.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package metadata and source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build --sdist
      - run: python -m twine check dist/*
